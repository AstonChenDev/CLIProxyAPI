services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cli-proxy-api
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
      PGSTORE_DSN: ${PGSTORE_DSN:-postgres://gcli2api:gcli2api_pass@host.docker.internal:15432/cliproxy?sslmode=disable}
      CHATGPT2API_IMAGE_STORAGE_ENABLED: ${CHATGPT2API_IMAGE_STORAGE_ENABLED:-}
      CHATGPT2API_IMAGE_STORAGE_MODE: ${CHATGPT2API_IMAGE_STORAGE_MODE:-}
      CHATGPT2API_COS_SECRET_ID: ${CHATGPT2API_COS_SECRET_ID:-}
      CHATGPT2API_COS_SECRET_KEY: ${CHATGPT2API_COS_SECRET_KEY:-}
      CHATGPT2API_COS_REGION: ${CHATGPT2API_COS_REGION:-}
      CHATGPT2API_COS_BUCKET: ${CHATGPT2API_COS_BUCKET:-}
      CHATGPT2API_COS_PATH_PREFIX: ${CHATGPT2API_COS_PATH_PREFIX:-}
      CHATGPT2API_IMAGE_PUBLIC_BASE_URL: ${CHATGPT2API_IMAGE_PUBLIC_BASE_URL:-}
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    restart: unless-stopped
