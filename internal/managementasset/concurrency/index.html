<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>凭证并发设置 · CLIProxyAPI</title>
  <link rel="stylesheet" href="/credential-concurrency-assets/concurrency.css">
  <script src="/credential-concurrency-assets/concurrency.js" defer></script>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">CLIPROXYAPI</p><h1>凭证并发设置</h1><p class="subtitle">每个账号单独设置，同时处理多少条请求，由你决定。</p></div><a class="back" href="/management.html#/auth-files">返回 CPA 管理台 ↗</a></header>
    <section class="login" id="login-panel">
      <form id="login-form"><label for="management-key">管理密码</label><div class="login-row"><input id="management-key" type="password" autocomplete="off" required placeholder="输入原管理面板的管理密码"><button type="submit" id="connect">连接 CPA</button></div><p class="hint">使用现有管理密码。密码仅保留在当前页面内存中。</p></form>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
    <section id="workspace" hidden>
      <div class="summary"><div><span id="credential-count">0</span><small>账号凭证</small></div><div><span id="limited-count">0</span><small>已设置上限</small></div><div><span id="inflight-count">0</span><small>已占用并发</small></div><button id="refresh" class="secondary">刷新数据</button><button id="disconnect" class="secondary">断开连接</button></div>
      <aside>上限为 <strong>2</strong>，表示该账号最多同时处理 2 条请求。流式请求直到结束才释放名额。<strong>留空或填 0 表示不限制。</strong>每行单独保存，不会改变账号的启停状态。</aside>
      <div class="toolbar"><h2>账号列表</h2><input id="search" type="search" aria-label="搜索账号" placeholder="搜索账号、文件名或供应商"></div>
      <div id="accounts" class="accounts"></div>
      <p class="hint">上限覆盖该账号的所有模型；修改后影响后续请求，已有请求不会被强行中断。此限制在当前 CPA 实例内生效。</p>
    </section>
    <footer>设置保存在原凭证存储中，由 CPA 执行，无需 Home。多实例不共享计数。</footer>
  </main>
</body>
</html>
